function renderList(){
  const q=$('filter').value.trim().toLowerCase();
  const groups=data.groupOrder.concat(['\u672a\u5206\u7ec4']);
  let html='';
  for(const g of groups){
    const items=data.pages.filter(p=>p.group===g&&(!q||(p.title+p.route+p.goal).toLowerCase().includes(q)));
    if(!items.length) continue;
    html += '<div class="group-title">'+esc(g)+'</div>';
    for(const p of items){
      html += '<div class="page-item '+(p.route===current?'active':'')+'" data-route="'+encodeURIComponent(p.route)+'"><span class="badge">'+(p.index+1)+'</span><div><b>'+esc(p.title)+'</b><div class="muted">'+esc(p.route)+'</div></div></div>';

  }
  $('pageList').innerHTML=html;
  $('pageList').querySelectorAll('.page-item[data-route]').forEach(el=>el.addEventListener('click',()=>openPage(decodeURIComponent(el.dataset.route))));

  const linkHtml = p.links.length
    ? p.links.map(l=>{
        const clean=l.split('?')[0].replace(/^[/]+/,'');
        return '<div class="link" data-route="'+encodeURIComponent(clean)+'">'+esc(l)+'</div>';
      }).join('')
    : '<div class="muted">\u6682\u65e0\u9759\u6001\u626b\u63cf\u5230\u7684\u51fa\u94fe</div>';
  $('screen').innerHTML='<div class="nav"><span>‹</span><div class="nav-title editable" contenteditable="true" data-field="title">'+esc(p.title)+'</div><span>···</span></div><section class="hero"><h3 class="editable" contenteditable="true" data-field="title">'+esc(p.title)+'</h3><p class="editable" contenteditable="true" data-field="goal">'+esc(p.goal)+'</p></section><div class="card"><div class="section-title">\u9875\u9762\u6a21\u5757</div><div class="chips">'+p.sections.map((s,i)=>'<span class="chip editable" contenteditable="true" data-section="'+i+'">'+esc(s)+'</span>').join('')+'</div></div><div class="card"><div class="section-title">\u4e3b\u64cd\u4f5c</div><div class="cta-row"><div class="cta">\u7ee7\u7eed/\u786e\u8ba4</div><div class="cta secondary">\u8fd4\u56de/\u66f4\u591a</div></div></div><div class="card"><div class="section-title">\u9875\u9762\u53bb\u5411</div><div class="link-list">'+linkHtml+'</div></div>';
  $('screen').querySelectorAll('.link[data-route]').forEach(el=>el.addEventListener('click',()=>openPage(decodeURIComponent(el.dataset.route))));
  $('screen').querySelectorAll('[contenteditable]').forEach(el=>el.addEventListener('input',()=>{if(el.dataset.field){p[el.dataset.field]=el.innerText.trim();} if(el.dataset.section){p.sections[Number(el.dataset.section)]=el.innerText.trim();} save(); renderInfo(); renderList();}));
}
function renderInfo(){const p=pageByRoute(current);$('info').innerHTML='<div class="field"><b>路由</b><br>'+esc(p.route)+'</div><div class="field"><b>分组</b><br>'+esc(p.group)+'</div><div class="field"><b>页面目标</b><br>'+esc(p.goal)+'</div>';$('links').innerHTML='<div class="mini-map">'+(p.links.length?p.links.map(l=>'<div class="map-row">'+esc(p.title)+' → '+esc(l)+'</div>').join(''):'<div class="muted">无出链</div>')+'</div>';}
function openPage(route){
  const normalized=String(route||'').replace(/^\/+/,'');
  if(data.pages.some(p=>p.route===normalized)){
    current=normalized;
  }else{
    const hit=data.pages.find(p=>normalized.startsWith(p.route));
    if(hit) current=hit.route;
  }
  renderList();renderScreen();renderInfo();
}
window.openPage=openPage;
$('filter').addEventListener('input',renderList);
$('resetBtn').onclick=()=>{if(confirm('恢复初始原型数据？')){localStorage.removeItem('party-recorder-rp-data');data=JSON.parse(JSON.stringify(initialData));current=data.pages[0].route;renderList();renderScreen();renderInfo();}};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='party-recorder-all-pages-edited.rp.json';a.click();URL.revokeObjectURL(a.href)};
renderList();renderScreen();renderInfo();
</script>
</body>
</html>
